# Setup: welcome and component list
setup.welcome_title:
  en: "Welcome"
  es: "Bienvenido"
  ja: "ようこそ"
setup.welcome_text:
  en: "Before you start, the app needs to download what makes the translator work. Items marked “Required” are essential; the rest add voice and Streamer mode."
  es: "Antes de empezar hay que descargar lo que hace funcionar al traductor. Lo marcado como «Necesario» es imprescindible; el resto añade la voz y el Modo Streamer."
  ja: "始める前に、翻訳に必要なものをダウンロードします。「必須」のものは欠かせません。その他は読み上げと配信モードを追加します。"
setup.note:
  en: "Everything installs in your personal folder and never asks for a password."
  es: "Todo se instala en tu carpeta personal y no pide contraseña."
  ja: "すべて個人フォルダにインストールされ、パスワードは不要です。"
