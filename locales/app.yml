settings.whisper_title:
  en: "Speech recognition (Whisper)"
  es: "Reconocimiento de voz (Whisper)"
  ja: "音声認識（Whisper）"
whisper.speech_threshold:
  en: "Speech threshold"
  es: "Umbral de voz"
  ja: "音声のしきい値"
whisper.speech_threshold_help:
  en: "Volume above which you count as speaking. Raise it if background noise creates subtitles; lower it if you are not detected."
  es: "Volumen a partir del cual se considera que hablas. Súbelo si el ruido de fondo genera subtítulos; bájalo si no te detecta."
  ja: "この音量を超えると話していると判断します。雑音で字幕が出るなら上げ、声が拾われないなら下げてください。"
whisper.end_of_speech_ms:
  en: "Pause that ends a sentence (ms)"
  es: "Pausa que cierra la frase (ms)"
  ja: "文の区切りとなる無音（ミリ秒）"
whisper.end_of_speech_ms_help:
  en: "Silence needed before a sentence is transcribed. Shorter shows subtitles sooner but may cut sentences."
  es: "Silencio necesario para transcribir una frase. Más corto muestra antes los subtítulos, pero puede partir frases."
  ja: "文を文字起こしするまでに必要な無音の長さです。短いほど早く表示されますが、文が途中で切れることがあります。"
whisper.min_speech_ms:
  en: "Minimum length (ms)"
  es: "Duración mínima (ms)"
  ja: "最短の長さ（ミリ秒）"
whisper.min_speech_ms_help:
  en: "Shorter sounds, like coughs or clicks, are ignored."
  es: "Los sonidos más cortos, como toses o clics, se ignoran."
  ja: "これより短い音（咳やクリック音など）は無視します。"
whisper.max_segment_ms:
  en: "Maximum sentence length (ms)"
  es: "Duración máxima de frase (ms)"
  ja: "文の最長の長さ（ミリ秒）"
whisper.max_segment_ms_help:
  en: "Long monologues are cut here so subtitles keep flowing."
  es: "Los monólogos largos se cortan aquí para que los subtítulos sigan saliendo."
  ja: "長く話し続けても字幕が途切れないよう、ここで区切ります。"
whisper.threads:
  en: "CPU threads"
  es: "Hilos de CPU"
  ja: "CPUスレッド数"
whisper.threads_help:
  en: "Threads Whisper uses. More is faster on the CPU, but leaves less for your game or stream."
  es: "Hilos que usa Whisper. Más es más rápido en CPU, pero deja menos para tu juego o directo."
  ja: "Whisperが使うスレッド数です。多いほどCPUでは速くなりますが、ゲームや配信に回る分が減ります。"
whisper.beam_size:
  en: "Beam size"
  es: "Tamaño de haz"
  ja: "ビームサイズ"
whisper.beam_size_help:
  en: "1 is the fastest. Higher values compare more candidates: slightly more accurate, but slower."
  es: "1 es lo más rápido. Valores mayores comparan más candidatos: algo más preciso, pero más lento."
  ja: "1が最速です。大きくするほど多くの候補を比べ、少し正確になりますが遅くなります。"
whisper.applies_on_start:
  en: "Changes apply the next time you start listening."
  es: "Los cambios se aplican la próxima vez que empieces a escuchar."
  ja: "変更は次に聞き取りを開始したときに反映されます。"
whisper.reset:
  en: "Reset to defaults"
  es: "Restablecer valores"
  ja: "初期値に戻す"

