<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KanniChan</title>
<style>
  /* Transparent so OBS draws only the letters over the stream. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  :root {
    --font-size: 52px;
    --outline-width: 2px;
    --text-color: #FFFFFF;
    --outline-color: #1F1B18;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 0 4vw 6vh;
    box-sizing: border-box;
    font-family: "Noto Serif CJK JP", "Yu Mincho", serif;
    color: var(--text-color);
    text-align: center;
    /* The stroke is centered on the glyph edge, so it is doubled and painted under the fill. */
    -webkit-text-stroke: calc(var(--outline-width) * 2) var(--outline-color);
    paint-order: stroke fill;
    text-shadow: 0 0 calc(var(--outline-width) * 4) var(--outline-color);
  }

  #subtitle {
    transition: opacity 400ms;
  }

  #subtitle.hidden {
    opacity: 0;
  }

  .original {
    font-size: var(--font-size);
    line-height: 1.6;
  }

  .translation {
    font-size: calc(var(--font-size) * 0.73);
    line-height: 1.6;
  }

  rt {
    font-size: 45%;
    -webkit-text-stroke-width: var(--outline-width);
  }

  .no-furigana rt {
    display: none;
  }
</style>
</head>
<body>
<div id="subtitle" class="hidden">
  <div class="original"></div>
  <div class="translation"></div>
</div>

<script>
  // Seconds a subtitle stays on screen after the last thing you said.
  const VISIBLE_SECONDS = 8;

  const subtitle = document.getElementById("subtitle");
  const original = subtitle.querySelector(".original");
  const translation = subtitle.querySelector(".translation");

  let shownId = 0;
  let hideTimer = null;

  // Built with DOM nodes, not HTML strings, so recognized text can never inject markup.
  function render(container, lines) {
    container.replaceChildren();

    for (const line of lines) {
      const lineElement = document.createElement("div");

      for (const piece of line) {
        if (piece.ruby) {
          const ruby = document.createElement("ruby");
          const reading = document.createElement("rt");

          ruby.append(piece.text);
          reading.textContent = piece.ruby;
          ruby.append(reading);
          lineElement.append(ruby);
        } else {
          lineElement.append(piece.text);
        }
      }

      container.append(lineElement);
    }
  }

  function applyStyle(style) {
    const root = document.documentElement.style;

    root.setProperty("--font-size", `${style.font_size}px`);
    root.setProperty("--outline-width", `${style.outline_width}px`);
    root.setProperty("--text-color", style.text_color);
    root.setProperty("--outline-color", style.outline_color);

    document.body.classList.toggle("no-furigana", !style.furigana);
  }

  async function poll() {
    try {
      const response = await fetch("/subtitle", { cache: "no-store" });
      const message = await response.json();

      applyStyle(message.style);

      if (message.id !== shownId && message.original) {
        shownId = message.id;

        render(original, message.original);
        render(translation, message.translation);

        subtitle.classList.remove("hidden");

        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => subtitle.classList.add("hidden"), VISIBLE_SECONDS * 1000);
      }
    } catch {
      // The app is closed or restarting; keep trying quietly.
    }

    setTimeout(poll, 300);
  }

  poll();
</script>
</body>
</html>
