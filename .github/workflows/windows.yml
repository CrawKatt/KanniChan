name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows (${{ matrix.gpu }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: nvidia
            features: cuda
          - gpu: amd
            features: vulkan

    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Without this, whisper.cpp targets the runner's own CPU (and GPU, which it lacks),
      # producing a binary that can crash on users' machines.
      GGML_NATIVE: "OFF"
      # Vulkan's shader generator nests deep enough inside target/ to pass Windows'
      # 260-character path limit, which MSBuild cannot handle.
      CARGO_TARGET_DIR: C:\t

    steps:
      - uses: actions/checkout@v7

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          notes() {
            awk -v heading="## [$version]" '
              index($0, "## ") == 1 { found = index($0, heading) == 1; next }
              /^\[[^]]+\]: / { next }
              found
            ' "$1"
          }

          for changelog in CHANGELOG.md CHANGELOG.es.md CHANGELOG.ja.md; do
            if ! notes "$changelog" | grep -q '[^[:space:]]'; then
              echo "::error::$changelog has no section for $version"
              exit 1
            fi
          done

          {
            notes CHANGELOG.md
            printf '\n<details>\n<summary>Español</summary>\n\n'
            notes CHANGELOG.es.md
            printf '\n</details>\n\n<details>\n<summary>日本語</summary>\n\n'
            notes CHANGELOG.ja.md
            printf '\n</details>\n'
          } > release-notes.md

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.gpu }}
          cache-targets: false

      - name: Install CUDA
        if: matrix.gpu == 'nvidia'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          method: local

      - name: Install Vulkan SDK
        if: matrix.gpu == 'amd'
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build
        run: cargo build --release --locked --no-default-features --features ${{ matrix.features }}

      - name: Package
        shell: pwsh
        run: Copy-Item "$env:CARGO_TARGET_DIR\release\kannichan.exe" "kannichan-windows-${{ matrix.gpu }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: kannichan-windows-${{ matrix.gpu }}
          path: kannichan-windows-${{ matrix.gpu }}.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: kannichan-windows-${{ matrix.gpu }}.exe
          body_path: release-notes.md
